<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ASHLIGHT</title>
<meta name="description" content="A narrative puzzle-platformer about the echoes you leave behind.">
<style>
  :root{
    --ink:#07070c;
    --ash:#9aa0b5;
    --ember:#ffb347;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#05050a;
    font-family:"Courier New",Courier,ui-monospace,monospace;
    color:var(--ash);
    -webkit-font-smoothing:none;
  }
  #stage{
    position:fixed;inset:0;display:grid;place-items:center;
    background:
      radial-gradient(ellipse at 50% 0%, #15131f 0%, #06060b 60%, #040408 100%);
  }
  #wrap{position:relative;line-height:0;filter:drop-shadow(0 18px 50px rgba(0,0,0,.85))}
  canvas#game{
    display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
    background:#06060c;
    border-radius:2px;
  }
  /* subtle scanline + vignette overlay, purely cosmetic */
  #crt{
    position:absolute;inset:0;pointer-events:none;border-radius:2px;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);
    mix-blend-mode:multiply;
    opacity:.85;
  }
  #crt.off{display:none}
  #boot{
    position:fixed;inset:0;display:grid;place-items:center;
    background:#05050a;z-index:20;cursor:pointer;
  }
  #boot .inner{text-align:center;letter-spacing:.42em;text-transform:uppercase}
  #boot h1{
    font-size:clamp(22px,6vw,54px);color:#f3ead8;font-weight:400;
    text-shadow:0 0 24px rgba(255,179,71,.45), 0 0 2px rgba(255,179,71,.8);
  }
  #boot p{margin-top:22px;font-size:12px;color:#5d6478;letter-spacing:.3em;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  #hint{
    position:fixed;left:0;right:0;bottom:6px;text-align:center;
    font-size:10px;letter-spacing:.22em;color:#2e3342;pointer-events:none;
    text-transform:uppercase;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="wrap">
      <canvas id="game" width="480" height="272"></canvas>
      <div id="crt"></div>
    </div>
  </div>

  <div id="boot"><div class="inner">
    <h1>Ashlight</h1>
    <p>click to begin</p>
  </div></div>

  <div id="hint">arrows / wasd &nbsp;&middot;&nbsp; z jump &nbsp;&middot;&nbsp; x echo &nbsp;&middot;&nbsp; c dash &nbsp;&middot;&nbsp; r reset room &nbsp;&middot;&nbsp; esc pause &nbsp;&middot;&nbsp; f fullscreen</div>

  <!-- load order matters: plain scripts so the game runs straight from file:// -->
  <script src="src/core/util.js"></script>
  <script src="src/core/input.js"></script>
  <script src="src/core/audio.js"></script>
  <script src="src/core/camera.js"></script>
  <script src="src/core/particles.js"></script>
  <script src="src/core/draw.js"></script>
  <script src="src/core/save.js"></script>
  <script src="src/data/levels.js"></script>
  <script src="src/data/story.js"></script>
  <script src="src/game/meta.js"></script>
  <script src="src/game/level.js"></script>
  <script src="src/game/entities.js"></script>
  <script src="src/game/echo.js"></script>
  <script src="src/game/player.js"></script>
  <script src="src/game/world.js"></script>
  <script src="src/game/dialogue.js"></script>
  <script src="src/game/scenes.js"></script>
  <script src="src/game/shop.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
